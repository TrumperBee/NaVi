name: navi_app
description: Nairobi Navigator - Find your way. Know your wait.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # State Management
  provider: ^6.1.1
  
  # Firebase (Free Tier)
  firebase_core: ^2.24.2
  cloud_firestore: ^4.14.0
  firebase_auth: ^4.16.0
  
  # Mapping & Location
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  geocoding: ^2.1.0  # For converting coordinates to street names
  
  # UI & Utilities
  google_fonts: ^6.1.0
  intl: ^0.18.1
  
  # Networking for OSRM (Open Source Routing Machine)
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Flutter Launcher Icons - for generating app icons
  flutter_launcher_icons: "^0.13.1"

# Flutter Launcher Icons configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#008751" # Nairobi Green
  adaptive_icon_foreground: "assets/images/logo-foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  
  # Assets section to include images
  assets:
    - assets/images/